<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo B2B — Founder/Head + Design/Produto</title>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2a2a32;
    --accent: #5b6ef7;
    --accent-dim: #3b4db040;
    --green: #3ecf8e;
    --yellow: #f5c842;
    --red: #f56b6b;
    --blue: #6ba4f5;
    --text: #e8e8f0;
    --text-muted: #6e6e85;
    --text-dim: #9999b0;
    --radius: 10px;
    --mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 34px; height: 34px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff; letter-spacing: -0.5px;
  }
  .header-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
    background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent);
  }
  .progress-bar-wrap {
    padding: 14px 28px 0; display: flex; align-items: center; gap: 12px;
  }
  .prog-label { font-size: 11px; color: var(--text-muted); width: 80px; }
  .prog-track {
    flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .prog-fill {
    height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease;
  }
  .prog-count { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
  .filter-bar {
    display: flex; gap: 6px; padding: 14px 28px 0; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 0;
    height: calc(100vh - 130px);
    min-height: 600px;
  }
  .col {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px;
    background: var(--surface);
  }
  .col:last-child { border-right: none; }
  .col::-webkit-scrollbar { width: 4px; }
  .col::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .col-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin-bottom: 12px;
  }
  .lead-list { max-height: calc(100vh - 180px); overflow-y: auto; }
  .lead-card {
    padding: 14px 16px; border-left: 3px solid transparent; cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .lead-card:hover { background: var(--surface2); }
  .lead-card.active { border-left-color: var(--accent); background: var(--surface2); }
  .lead-card.done { opacity: 0.45; }
  .lead-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .lead-empresa { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .lead-cargo { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-style: italic; }
  .tag {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px;
    display: inline-block; margin-top: 6px; margin-right: 4px;
  }
  .tag-email { background: #1e3a2f; color: var(--green); }
  .tag-wa { background: #1a3320; color: #5bd07a; }
  .tag-li { background: #1a2240; color: #7b9ef7; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
  }
  .status-dot.pending { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.respondido { background: var(--blue); }
  .status-dot.em-andamento { background: var(--yellow); }
  .status-dot.encerrado { background: var(--green); }
  .status-dot.descarte { background: var(--red); }
  .msg-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    font-size: 13px; line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .step-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .step-tab {
    padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer;
  }
  .step-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .step-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
  .action-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; background: var(--accent); color: #fff;
  }
  .btn-secondary {
    background: var(--surface); color: var(--text-dim); border: 1px solid var(--border);
  }
  .status-select {
    width: 100%; padding: 9px 10px; border-radius: 8px; background: var(--surface);
    color: var(--text); border: 1px solid var(--border); font-size: 13px;
  }
  .contact-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 500; text-decoration: none; margin-top: 8px; margin-right: 6px;
  }
  .chip-email { background: #1e3a2f; color: var(--green); }
  .chip-wa { background: #1a3320; color: #5bd07a; }
  .chip-li { background: #1a2240; color: #7b9ef7; }
  .empty-state {
    color: var(--text-muted); font-size: 12px; padding-top: 8px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; height: auto; }
    .col { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo-mark">FG</div>
    <div>
      <div class="header-title">Fluxo B2B — Founder/Head + Design/Produto</div>
      <div class="header-sub">Mensagens personalizadas e status por lead</div>
    </div>
  </div>
  <span class="pill" id="pill-count">...</span>
</header>
<div class="progress-bar-wrap">
  <span class="prog-label">Progresso</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <span class="prog-count" id="prog-count">0 / 0</span>
</div>
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
  <button class="filter-btn" onclick="setFilter('pendente',this)">Pendentes</button>
  <button class="filter-btn" onclick="setFilter('respondido',this)">Respondidos</button>
  <button class="filter-btn" onclick="setFilter('em andamento',this)">Em andamento</button>
  <button class="filter-btn" onclick="setFilter('encerrado',this)">Encerrados</button>
  <button class="filter-btn" onclick="setFilter('descarte',this)">Descarte</button>
</div>
<div class="grid">
  <div class="col">
    <div class="col-title">Leads</div>
    <div class="lead-list" id="lead-list"></div>
  </div>
  <div class="col">
    <div class="col-title">Perfil</div>
    <div id="profile"></div>
  </div>
  <div class="col">
    <div class="col-title">Mensagem</div>
    <div id="message"></div>
  </div>
  <div class="col">
    <div class="col-title">Ações</div>
    <div id="actions"></div>
  </div>
</div>
<script>
const STATUS_OPTIONS = ["pendente","respondido","em andamento","encerrado","descarte"];
let leads = [];
let activeId = null;
let activeStep = 0;
let filter = 'all';

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}
function updateProgress() {
  const done = leads.filter(l => l.status === 'encerrado' || l.status === 'descarte').length;
  const pct = leads.length ? (done / leads.length) * 100 : 0;
  const byStatus = {};
  leads.forEach(l => { const s = l.status || 'pendente'; byStatus[s] = (byStatus[s]||0)+1; });
  const counts = STATUS_OPTIONS.map(s => `${s}: ${byStatus[s]||0}`).join('  ·  ');
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-count').textContent = `${done} / ${leads.length}`;
  document.getElementById('pill-count').textContent = counts;
}
function saveState() {
  try {
    const state = {};
    leads.forEach(l => { if (l.status) state[l.id] = l.status; });
    localStorage.setItem('t1_founder_status', JSON.stringify(state));
  } catch {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('t1_founder_status');
    if (!raw) return;
    const state = JSON.parse(raw);
    leads.forEach(l => { if (state[l.id]) l.status = state[l.id]; });
  } catch {}
}
function renderList() {
  const list = document.getElementById('lead-list');
  const visible = leads.filter(l => filter === 'all' ? true : l.status === filter);
  const statuses = STATUS_OPTIONS;
  list.innerHTML = visible.map(l => {
    const status = l.status || 'pendente';
    const statusOptions = statuses.map(s => `<option value="${s}" ${status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
    const actions = [];
    if (l.linkedin) actions.push(`<a href="${l.linkedin}" target="_blank" class="contact-chip chip-li">LinkedIn</a>`);
    if (l.wa) actions.push(`<a href="https://wa.me/${l.wa.replace(/\\D/g,'')}" target="_blank" class="contact-chip chip-wa">WhatsApp</a>`);
    if (l.email) actions.push(`<a href="mailto:${l.email}" class="contact-chip chip-email">Email</a>`);
    return `<div class="lead-card ${status==='encerrado'||status==='descarte'?'done':''} ${activeId===l.id?'active':''}" onclick="selectLead(${l.id})">
      <div class="lead-name">${l.nome}</div>
      <div class="lead-empresa">${l.empresa || ''}</div>
      <div class="lead-cargo">${l.cargo || ''}</div>
      <div style="margin-top:8px;">
        <select class="status-select" onchange="event.stopPropagation(); setStatus(${l.id}, this.value)">${statusOptions}</select>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">${actions.join('')}</div>
    </div>`;
  }).join('');
}
function selectLead(id) {
  activeId = id;
  activeStep = 0;
  renderList();
  renderDetail();
}
function selectStep(i) {
  activeStep = i;
  renderDetail();
}
function setStatus(id, status) {
  const l = leads.find(x => x.id === id);
  if (l) {
    l.status = status;
    saveState();
    updateProgress();
    renderList();
    renderDetail();
  }
}
function renderDetail() {
  const l = leads.find(x => x.id === activeId);
  if (!l) return;
  const step = l.steps && l.steps[activeStep] ? l.steps[activeStep] : { dia: '', msg: '' };
  const contacts = [];
  if (l.email) contacts.push(`<a href="mailto:${l.email}" class="contact-chip chip-email">✉ ${l.email}</a>`);
  if (l.wa) contacts.push(`<a href="https://wa.me/${l.wa.replace(/\\D/g,'')}" target="_blank" class="contact-chip chip-wa">💬 ${l.wa}</a>`);
  if (l.linkedin) contacts.push(`<a href="${l.linkedin}" target="_blank" class="contact-chip chip-li">in LinkedIn</a>`);
  const stepTabs = (l.steps || []).map((s, i) =>
    `<button class="step-tab ${i === activeStep ? 'active' : ''}" onclick="selectStep(${i})">${s.label}</button>`
  ).join('');
  const statusOptions = STATUS_OPTIONS.map(s =>
    `<option value="${s}" ${l.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`
  ).join('');
  document.getElementById('profile').innerHTML = `
    <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">${l.nome}</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:4px;">${l.cargo || ''}</div>
    <div style="font-size:13px;color:var(--accent);margin-bottom:12px;font-weight:500;">${l.empresa || ''}</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Contato</div>
    <div>${contacts.join('')}</div>
    <div class="msg-box" style="margin-top:12px;">
      <strong style="color:var(--accent);">Ângulo:</strong> ${l.angle || ''}<br>
      <strong style="color:var(--accent);">Canal:</strong> ${l.channel === 'wa' ? 'WhatsApp' : l.channel === 'email' ? 'E-mail' : 'LinkedIn'}
    </div>
  `;
  document.getElementById('message').innerHTML = `
    <div class="step-tabs">${stepTabs}</div>
    <div class="step-meta">${step.dia} · via ${l.channel === 'wa' ? 'WhatsApp' : l.channel === 'email' ? 'E-mail' : 'LinkedIn'}</div>
    <div class="msg-box" style="position:relative;margin-top:8px;">
      <button class="btn btn-secondary" style="position:absolute;top:8px;right:8px;padding:5px 10px;font-size:11px;" id="copy-btn-${l.id}" onclick="copyMsg(${l.id})">copiar</button>
      ${(step.msg || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\n/g,'<br>')}
    </div>
  `;
  document.getElementById('actions').innerHTML = `
    <select class="status-select" onchange="setStatus(${l.id}, this.value)">
      ${statusOptions}
    </select>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="copyMsg(${l.id})">Copiar mensagem</button>
      ${l.linkedin ? `<a href="${l.linkedin}" target="_blank" class="btn btn-secondary">Abrir LinkedIn →</a>` : ''}
    </div>
  `;
}
updateProgress();
renderList();
</script>
</body>
</html>
