<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lista Vaga/Contratação — Contatos</title>
<style>
  :root {
    --bg:#0f0f11; --surface:#18181c; --surface2:#222228; --border:#2a2a32;
    --accent:#5b6ef7; --accent-dim:#3b4db040; --green:#3ecf8e; --yellow:#f5c842;
    --red:#f56b6b; --blue:#6ba4f5; --text:#e8e8f0; --text-muted:#6e6e85;
    --text-dim:#9999b0; --radius:10px; --mono:'JetBrains Mono','Fira Mono',monospace;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;align-items:center;gap:14px}
  .logo-mark{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;letter-spacing:-0.5px}
  .header-title{font-size:13px;font-weight:600;color:var(--text)}
  .header-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent)}
  .toolbar{display:flex;gap:10px;padding:14px 28px 0;flex-wrap:wrap;align-items:center}
  .search{padding:8px 12px;border-radius:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);font-size:13px;min-width:220px}
  .filter-btn{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer}
  .filter-btn:hover{border-color:var(--accent);color:var(--accent)}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .list-wrap{max-width:1000px;margin:20px auto;padding:0 28px 28px}
  .contact{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-left:3px solid transparent;border-bottom:1px solid var(--border);background:var(--surface);margin-bottom:8px;border-radius:8px;flex-wrap:wrap}
  .contact:hover{background:var(--surface2)}
  .contact.done{opacity:.45}
  .contact-name{font-weight:600;font-size:13px;color:var(--text);text-decoration:none}
  .contact-name:hover{text-decoration:underline}
  .contact-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
  .contact-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .status-select{padding:8px 10px;border-radius:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);font-size:13px}
  .btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
  .btn-secondary{background:var(--surface);color:var(--text-dim);border:1px solid var(--border)}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.12);display:inline-block;white-space:nowrap}
  .b-green{color:var(--green);border-color:rgba(10,255,176,.25);background:rgba(10,255,176,.10)}
  .b-blue{color:var(--blue);border-color:rgba(125,196,255,.25);background:rgba(125,196,255,.10)}
  .b-amber{color:var(--yellow);border-color:rgba(255,209,102,.25);background:rgba(255,209,102,.10)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 28px 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
  .k{font-size:10px;color:var(--text-muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
  .v{font-size:22px;font-weight:800;margin-top:4px}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)} .contact{flex-direction:column;align-items:flex-start} .contact-actions{width:100%;justify-content:flex-end}}
  @media(max-width:480px){.kpis{grid-template-columns:1fr 1fr} body{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo-mark">VC</div>
    <div>
      <div class="header-title">Lista Vaga/Contratação</div>
      <div class="header-sub">Status por contato</div>
    </div>
  </div>
  <span class="pill" id="pill-count">Carregando...</span>
</header>

<div class="kpis">
  <div class="card"><div class="k">Total</div><div class="v" id="k-total">0</div></div>
  <div class="card"><div class="k">Enviado</div><div class="v" id="k-enviado">0</div></div>
  <div class="card"><div class="k">Retorno OK</div><div class="v" id="k-retorno">0</div></div>
  <div class="card"><div class="k">Ganho/Perda</div><div class="v" id="k-resultado">0</div></div>
</div>

<div class="toolbar">
  <input class="search" id="search" placeholder="Buscar por nome, empresa ou cargo..." oninput="render()" />
  <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
  <button class="filter-btn" onclick="setFilter('pendente',this)">Pendentes</button>
  <button class="filter-btn" onclick="setFilter('enviado',this)">Enviado</button>
  <button class="filter-btn" onclick="setFilter('retorno ok',this)">Retorno OK</button>
  <button class="filter-btn" onclick="setFilter('sem resposta',this)">Sem resposta</button>
  <button class="filter-btn" onclick="setFilter('ganho',this)">Ganho</button>
  <button class="filter-btn" onclick="setFilter('perda',this)">Perda</button>
</div>

<div class="list-wrap" id="list"></div>

<script>
const STATUS_OPTIONS = ["pendente","enviado","retorno ok","sem resposta","ganho","perda"];
let rows = [];
let filter = 'all';

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length < 2) return [];
  const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
  return lines.slice(1).map((line,idx)=>{
    const cols = line.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (cols[i]||'').trim());
    obj._id = idx;
    return obj;
  });
}

function isBR(r){
  const txt = `${r.nome||''} ${r.empresa||''} ${r.cargo||''}`.toLowerCase();
  return /brasil|brazil|rio|são paulo|sp|rj|mg|bh|curitiba|porto alegre|salvador|recife|pernambuco|ceará|goiás|brasília|df/.test(txt);
}

function setFilter(f, btn){
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setStatus(id, status){
  const r = rows.find(x=>x._id===id);
  if(r){ r.status = status; saveState(); render(); }
}

function saveState(){
  try {
    const state = {};
    rows.forEach(r=>{ if(r.status) state[r._id] = r.status; });
    localStorage.setItem('vaga_contratacao_status_2col', JSON.stringify(state));
  } catch {}
}
function loadState(){
  try {
    const raw = localStorage.getItem('vaga_contratacao_status_2col');
    if(!raw) return;
    const state = JSON.parse(raw);
    rows.forEach(r=>{ if(state[r._id]) r.status = state[r._id]; });
  } catch {}
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('list');
  let data = rows;
  if(filter !== 'all') data = data.filter(r=>(r.status||'pendente')===filter);
  if(q) data = data.filter(r=> (r.nome||'').toLowerCase().includes(q) || (r.empresa||'').toLowerCase().includes(q) || (r.cargo||'').toLowerCase().includes(q));

  const total = rows.length;
  const enviado = rows.filter(r=>(r.status||'pendente')==='enviado').length;
  const retorno = rows.filter(r=>(r.status||'pendente')==='retorno ok').length;
  const resultado = rows.filter(r=>['ganho','perda'].includes(r.status||'pendente')).length;
  document.getElementById('k-total').textContent = String(total);
  document.getElementById('k-enviado').textContent = String(enviado);
  document.getElementById('k-retorno').textContent = String(retorno);
  document.getElementById('k-resultado').textContent = String(resultado);
  document.getElementById('pill-count').textContent = `${total} contatos`;

  container.innerHTML = data.slice(0,500).map(r=>{
    const status = r.status || 'pendente';
    const statusOpts = STATUS_OPTIONS.map(s=>`<option value="${s}" ${status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
    const name = r.nome || '';
    const linkedin = r.linkedin || '';
    const email = r.e_mail || '';
    const wa = r.whatsapp || '';
    const br = isBR(r);
    const nameLink = linkedin ? `<a class="contact-name" href="${linkedin}" target="_blank">${name}</a>` : `<span class="contact-name">${name}</span>`;
    const emailBtn = email ? `<a class="btn btn-secondary" href="mailto:${email}" target="_blank">Email</a>` : (wa ? `<a class="btn btn-secondary" href="https://wa.me/${wa.replace(/\D/g,'')}" target="_blank">WhatsApp</a>` : '');
    const badge = br ? '<span class="badge b-green">BR</span>' : '<span class="badge b-blue">Global</span>';
    return `<div class="contact ${status==='ganho'||status==='perda'?'done':''}">
      <div>
        ${nameLink}
        <div class="contact-meta">${badge} · ${r.empresa||''} · ${r.cargo||''}</div>
      </div>
      <div class="contact-actions">
        ${emailBtn}
        <select class="status-select" onchange="setStatus(${r._id}, this.value)">${statusOpts}</select>
      </div>
    </div>`;
  }).join('') || '<div class="contact"><div class="contact-meta">Nenhum registro.</div></div>';
}

(async function init(){
  const text = await fetch('00 - Lista Vaga_Contratacao.csv').then(r=>r.text()).catch(()=>'');
  if(!text){ document.getElementById('list').innerHTML='<div class="contact"><div class="contact-meta">Erro ao carregar CSV.</div></div>'; return; }
  rows = parseCSV(text);
  loadState();
  render();
})();
</script>
</body>
</html>
